name: Diagnose production routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/amrdiy_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/amrdiy_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Inspect public routing on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE_SCRIPT'
              set -euo pipefail
              export PATH="/usr/sbin:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:$PATH"
              printf 'user=%s\n' "$(id -un)"
              printf 'nginx=%s\n' "$(command -v nginx || true)"
              if [[ "$(id -u)" == "0" ]]; then
                SUDO=()
              elif sudo -n true 2>/dev/null; then
                SUDO=(sudo -n)
              else
                SUDO=()
                echo 'passwordless_sudo=false'
              fi

              echo '--- listeners ---'
              "${SUDO[@]}" ss -ltnp 2>/dev/null \
                | grep -E ':(80|443|3000|8000)[[:space:]]' || true

              echo '--- relevant processes ---'
              ps -eo pid,user,args \
                | grep -E '[v]ite|[c]loudflared|[n]ginx' \
                | sed -E 's#(token|secret|password)=[^ ]+#\1=***#Ig' || true

              echo '--- nginx routing ---'
              if command -v nginx >/dev/null; then
                "${SUDO[@]}" nginx -T 2>&1 \
                  | grep -E '^# configuration file|^[[:space:]]*(listen|server_name|root|proxy_pass|try_files)[[:space:]]' \
                  | grep -E 'configuration file|amrdiy|listen|root|proxy_pass|try_files' || true
              fi

              echo '--- local host checks ---'
              curl --silent --show-error --output /dev/null \
                --write-out 'localhost_default=%{http_code}\n' http://127.0.0.1/ || true
              curl --silent --show-error --output /dev/null \
                --header 'Host: amrdiy.com' \
                --write-out 'localhost_amrdiy=%{http_code}\n' http://127.0.0.1/ || true
              curl --insecure --silent --show-error --output /dev/null \
                --resolve 'amrdiy.com:443:127.0.0.1' \
                --write-out 'localhost_amrdiy_https=%{http_code}\n' https://amrdiy.com/ || true
              curl --silent --show-error --output /dev/null \
                --header 'Host: amrdiy.com' \
                --write-out 'vite_amrdiy=%{http_code}\n' http://127.0.0.1:3000/ || true
          REMOTE_SCRIPT
