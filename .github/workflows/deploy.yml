name: Deploy AMRDIY to Debian VPS

on:
  workflow_run:
    workflows: ["AMR DIY CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amrdiy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.0"
  BACKEND_PORT: ${{ vars.BACKEND_PORT || '8000' }}

jobs:
  deploy:
    name: Build and deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate deployment configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          set -euo pipefail

          for name in VPS_HOST VPS_PORT VPS_USER VPS_PATH VPS_SSH_KEY \
            VPS_KNOWN_HOSTS BACKEND_ENV FRONTEND_ENV; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done

          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || {
            echo "::error::VPS_PORT must be numeric"
            exit 1
          }

          [[ "$VPS_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$VPS_PATH" != "/" ]] || {
            echo "::error::VPS_PATH must be a safe absolute path and must not be /"
            exit 1
          }

          for name in CLIENT_URL MONGO_URI AUTH_SECRET AUTH_URL; do
            printf '%s\n' "$BACKEND_ENV" | grep -q "^${name}=" || {
              echo "::error::BACKEND_ENV is missing $name"
              exit 1
            }
          done

          for name in VITE_API VITE_STRIPE_KEY; do
            printf '%s\n' "$FRONTEND_ENV" | grep -q "^${name}=" || {
              echo "::error::FRONTEND_ENV is missing $name"
              exit 1
            }
          done

          configured_port="$(
            printf '%s\n' "$BACKEND_ENV" \
              | sed -n 's/^PORT=\([0-9][0-9]*\)$/\1/p' \
              | tail -n 1
          )"
          configured_port="${configured_port:-8000}"
          (( configured_port >= 1 && configured_port <= 65535 )) || {
            echo "::error::PORT in BACKEND_ENV must be between 1 and 65535"
            exit 1
          }
          printf 'BACKEND_PORT=%s\n' "$configured_port" >> "$GITHUB_ENV"

      - name: Install and validate backend
        working-directory: backend
        run: |
          npm ci
          npm run check
          find . -path ./node_modules -prune -o -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Install, test and build frontend
        working-directory: frontend
        shell: bash
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$FRONTEND_ENV" > .env.production
          npm ci
          VITE_API=http://127.0.0.1:8000/api \
            VITE_STRIPE_KEY=pk_test_ci_placeholder \
            npm test -- --passWithNoTests
          npm run build
          test -f build/index.html

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/amrdiy_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/amrdiy_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Test VPS connection and prepare directories
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$VPS_PATH/backend' '$VPS_PATH/frontend'"

      - name: Upload backend
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='coverage' \
            --exclude='.git' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i $HOME/.ssh/amrdiy_deploy_key -p $VPS_PORT" \
            backend/ "$VPS_USER@$VPS_HOST:$VPS_PATH/backend/"

      - name: Upload frontend build
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i $HOME/.ssh/amrdiy_deploy_key -p $VPS_PORT" \
            frontend/build/ "$VPS_USER@$VPS_HOST:$VPS_PATH/frontend/"

      - name: Allow Nginx to read frontend files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "chmod o+x '$VPS_PATH' && \
             find '$VPS_PATH/frontend' -type d -exec chmod 755 {} + && \
             find '$VPS_PATH/frontend' -type f -exec chmod 644 {} +"

      - name: Serve frontend build through Nginx
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' bash -s" <<'REMOTE_SCRIPT'
              set -euo pipefail
              export PATH="/usr/sbin:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:$PATH"

              if [[ "$(id -u)" == "0" ]]; then
                SUDO=()
              elif sudo -n true 2>/dev/null; then
                SUDO=(sudo -n)
              else
                echo "::error title=Nginx configuration::The deploy user needs passwordless sudo to update Nginx."
                exit 1
              fi

              NGINX_SITE="/etc/nginx/sites-enabled/amrdiy.com"
              [[ -f "$NGINX_SITE" ]] || {
                echo "::error title=Nginx configuration::Missing $NGINX_SITE"
                exit 1
              }

              "${SUDO[@]}" install -d -m 700 /var/backups/amrdiy-nginx
              BACKUP="/var/backups/amrdiy-nginx/amrdiy.com.before-static"
              "${SUDO[@]}" cp "$NGINX_SITE" "$BACKUP"

              if "${SUDO[@]}" grep -qE 'proxy_pass[[:space:]]+http://127\.0\.0\.1:3000;' "$NGINX_SITE"; then
                "${SUDO[@]}" sed -i \
                  "/proxy_pass[[:space:]]\+http:\/\/127\\.0\\.0\\.1:3000;/c\\        root $VPS_PATH/frontend;\\n        index index.html;\\n        try_files \$uri \$uri/ /index.html;" \
                  "$NGINX_SITE"
              fi

              if ! "${SUDO[@]}" nginx -t; then
                "${SUDO[@]}" cp "$BACKUP" "$NGINX_SITE"
                "${SUDO[@]}" nginx -t
                echo "::error title=Nginx configuration::Invalid static frontend configuration; restored the previous file."
                exit 1
              fi

              "${SUDO[@]}" systemctl reload nginx
              frontend_status="000"
              for attempt in {1..10}; do
                frontend_status="$(
                  curl --insecure --silent --show-error \
                    --resolve 'amrdiy.com:443:127.0.0.1' \
                    --output /dev/null --write-out '%{http_code}' \
                    https://amrdiy.com/ || true
                )"
                [[ "$frontend_status" == "200" ]] && break
                sleep 2
              done
              [[ "$frontend_status" == "200" ]] || {
                echo "::error title=Nginx frontend health check::amrdiy.com returned HTTP $frontend_status after reload."
                exit 1
              }
          REMOTE_SCRIPT

      - name: Create backend environment file
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKEND_ENV" | ssh \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "umask 077; cat > '$VPS_PATH/backend/.env.tmp' && mv '$VPS_PATH/backend/.env.tmp' '$VPS_PATH/backend/.env'"

      - name: Install production dependencies and reload PM2
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' NODE_VERSION='$NODE_VERSION' bash -s" <<'REMOTE_SCRIPT'
              set -euo pipefail

              DEPLOY_STAGE="initialize"
              trap 'rc=$?; printf "::error title=VPS deploy stage failed::Stage %s exited with code %s\n" "$DEPLOY_STAGE" "$rc"; exit "$rc"' ERR

              DEPLOY_STAGE="configure-node-path"
              export PM2_HOME="$VPS_PATH/.pm2"
              mkdir -p "$PM2_HOME"

              export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
              if [[ -s "$NVM_DIR/nvm.sh" ]]; then
                # SSH runs a non-interactive shell, so NVM must be loaded explicitly.
                # shellcheck disable=SC1090
                . "$NVM_DIR/nvm.sh"
                DEPLOY_STAGE="install-node"
                nvm install "$NODE_VERSION"
                nvm use "$NODE_VERSION"
              elif [[ -x "/usr/local/bin/node" && -x "/usr/local/bin/npm" ]]; then
                export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
              elif [[ -x "/usr/bin/node" && -x "/usr/bin/npm" ]]; then
                export PATH="/usr/bin:/usr/local/bin:/bin:$PATH"
              fi

              DEPLOY_STAGE="validate-node"
              command -v node >/dev/null || {
                echo "::error title=Node.js unavailable::Node.js was not found for VPS user $(id -un). Install NVM in $NVM_DIR or install Node.js $NODE_VERSION system-wide."
                exit 1
              }
              DEPLOY_STAGE="validate-npm"
              command -v npm >/dev/null || {
                echo "::error title=npm unavailable::npm was not found for VPS user $(id -un)."
                exit 1
              }
              node --version
              npm --version

              DEPLOY_STAGE="change-backend-directory"
              cd "$VPS_PATH/backend"

              DEPLOY_STAGE="validate-local-mongodb"
              mongo_uri="$(sed -n 's/^MONGO_URI=//p' .env | tail -n 1)"
              if [[ "$mongo_uri" == mongodb://*127.0.0.1:27018* || "$mongo_uri" == mongodb://*localhost:27018* ]]; then
                if ! timeout 2 bash -c '</dev/tcp/127.0.0.1/27018' 2>/dev/null; then
                  if timeout 2 bash -c '</dev/tcp/127.0.0.1/27017' 2>/dev/null; then
                    sed -i '/^MONGO_URI=/ { s#127\.0\.0\.1:27018#127.0.0.1:27017#; s#localhost:27018#127.0.0.1:27017#; }' .env
                    echo "MongoDB was detected on port 27017; corrected the local production connection port."
                  else
                    echo "::error title=MongoDB unavailable::No MongoDB service is listening on local ports 27018 or 27017. Update MONGO_URI in the BACKEND_ENV secret or start MongoDB on the VPS."
                    exit 1
                  fi
                fi
              fi

              DEPLOY_STAGE="npm-ci-production"
              npm ci --omit=dev

              DEPLOY_STAGE="pm2-delete-old-process"
              ./node_modules/.bin/pm2 delete amrdiy-backend >/dev/null 2>&1 || true
              for log_file in \
                "$PM2_HOME/logs/amrdiy-backend-error.log" \
                "$PM2_HOME/logs/amrdiy-backend-out.log"; do
                [[ -f "$log_file" ]] && : > "$log_file"
              done
              DEPLOY_STAGE="pm2-start-backend"
              ./node_modules/.bin/pm2 start server.js \
                --name amrdiy-backend \
                --cwd "$VPS_PATH/backend" \
                --update-env
              DEPLOY_STAGE="pm2-save-process-list"
              ./node_modules/.bin/pm2 save
              DEPLOY_STAGE="complete"
          REMOTE_SCRIPT

      - name: Verify deployment
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "test -f '$VPS_PATH/frontend/index.html' || { echo '::error title=Frontend health check::Frontend index.html is missing'; exit 1; }; \
             curl --retry 6 --retry-delay 5 --retry-connrefused \
               --fail --silent --show-error \
               'http://127.0.0.1:${BACKEND_PORT}/api/health' || { echo '::error title=Backend health check::Backend did not respond on port ${BACKEND_PORT}'; exit 1; }; \
             curl --fail --silent --show-error --output /dev/null \
               'http://127.0.0.1/' || { echo '::error title=Frontend health check::Nginx cannot serve the frontend index'; exit 1; }; \
             curl --retry 4 --retry-delay 3 \
               --fail --silent --show-error --output /dev/null \
               'https://amrdiy.com/' || { echo '::error title=Public frontend health check::amrdiy.com is not serving the deployed frontend'; exit 1; }; \
             curl --fail --silent --show-error \
               'http://127.0.0.1/api/health' || echo '::warning title=Reverse proxy health check::Nginx does not expose /api/health on port 80; verify that FRONTEND_ENV VITE_API points to the backend URL'"

      - name: Diagnose VPS deployment failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' NODE_VERSION='$NODE_VERSION' bash -s" <<'REMOTE_SCRIPT'
              export PM2_HOME="$VPS_PATH/.pm2"
              export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
              if [[ -s "$NVM_DIR/nvm.sh" ]]; then
                # shellcheck disable=SC1090
                . "$NVM_DIR/nvm.sh"
                nvm use "$NODE_VERSION" >/dev/null 2>&1 || true
              else
                export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
              fi

              cd "$VPS_PATH/backend"
              pm2_pid="$(./node_modules/.bin/pm2 pid amrdiy-backend 2>/dev/null || true)"
              printf '::error title=PM2 backend diagnostics::Process PID: %s\n' "${pm2_pid:-not-running}"
              pm2_summary="$(
                ./node_modules/.bin/pm2 jlist 2>/dev/null \
                  | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => { const item = JSON.parse(value || "[]").find(entry => entry.name === "amrdiy-backend"); const env = item?.pm2_env || {}; console.log(`status=${env.status || "missing"}, restarts=${env.restart_time ?? 0}, exit_code=${env.exit_code ?? "unknown"}`); })' \
                  2>/dev/null || true
              )"
              printf '::error title=PM2 backend state::%s\n' "${pm2_summary:-unavailable}"
              for log_file in \
                "$PM2_HOME/logs/amrdiy-backend-error.log" \
                "$PM2_HOME/logs/amrdiy-backend-out.log"; do
                [[ -f "$log_file" ]] || continue
                safe_error="$(
                  tail -n 100 "$log_file" \
                    | grep -E 'DB CONNECTION ERR|Missing required environment variable|Error:|TypeError:|SyntaxError:|MODULE_NOT_FOUND|Server is running|DB CONNECTED' \
                    | tail -n 8 \
                    | tr '\n' ';' \
                    || true
                )"
                safe_error="${safe_error//'%'/'%25'}"
                safe_error="${safe_error//$'\r'/'%0D'}"
                safe_error="${safe_error//$'\n'/'%0A'}"
                if [[ -n "$safe_error" ]]; then
                  printf '::error title=Backend startup log::%s\n' "$safe_error"
                fi
              done
              ./node_modules/.bin/pm2 describe amrdiy-backend || true
              ./node_modules/.bin/pm2 logs amrdiy-backend --nostream --lines 80 || true
          REMOTE_SCRIPT
