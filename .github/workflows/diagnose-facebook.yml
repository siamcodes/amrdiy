name: Diagnose Facebook production auth

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/amrdiy_deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/amrdiy_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Inspect deployed Facebook provider
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/amrdiy_deploy_key" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "VPS_PATH='$VPS_PATH' bash -s" <<'REMOTE_SCRIPT'
              set -euo pipefail
              export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
              [[ -s "$NVM_DIR/nvm.sh" ]] && . "$NVM_DIR/nvm.sh"
              cd "$VPS_PATH/backend"

              node --input-type=module <<'NODE'
                await import("dotenv/config");
                const { authConfig } = await import("./auth/config.mjs");
                const provider = authConfig.providers.find(({ id }) => id === "facebook");
                console.log(`env_config_present=${/^\d+$/.test(process.env.AUTH_FACEBOOK_CONFIG_ID || "")}`);
                console.log(`provider_config_present=${/^\d+$/.test(provider?.authorization?.params?.config_id || "")}`);
                console.log(`provider_scope_empty=${provider?.authorization?.params?.scope === ""}`);
              NODE

              cookie_file="$(mktemp)"
              trap 'rm -f "$cookie_file"' EXIT
              csrf_json="$(curl --insecure --silent --show-error \
                --cookie-jar "$cookie_file" \
                --resolve 'api.amrdiy.com:443:127.0.0.1' \
                https://api.amrdiy.com/api/auth/csrf)"
              csrf_token="$(node -e 'let s=""; process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).csrfToken))' <<<"$csrf_json")"
              auth_json="$(curl --insecure --silent --show-error \
                --cookie "$cookie_file" \
                --resolve 'api.amrdiy.com:443:127.0.0.1' \
                --header 'Origin: https://amrdiy.com' \
                --header 'X-Auth-Return-Redirect: 1' \
                --data-urlencode "csrfToken=$csrf_token" \
                --data-urlencode 'callbackUrl=https://amrdiy.com/login' \
                https://api.amrdiy.com/api/auth/signin/facebook)"
              node -e '
                let s="";
                process.stdin.on("data",c=>s+=c).on("end",()=>{
                  const url = new URL(JSON.parse(s).url);
                  console.log(`local_oauth_config_present=${url.searchParams.has("config_id")}`);
                  console.log(`local_oauth_scope=${url.searchParams.get("scope") ?? "absent"}`);
                });
              ' <<<"$auth_json"
          REMOTE_SCRIPT
